name: MATLAB release checks

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Set up MATLAB
        uses: matlab-actions/setup-matlab@v3
        with:
          release: R2022b

      - name: Run Green--Laplace checks
        uses: matlab-actions/run-command@v3
        with:
          command: setup_green_laplace; addpath("tests"); run_release_tests
